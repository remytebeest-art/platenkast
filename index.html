<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platenkast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Shrikhand&display=swap" rel="stylesheet">
<style>
:root{
  /* Eén wereld: platenzaak bij avondlicht. Petrol vloer, crème hoezen, tomaatrood als enige accent. */
  --floor:#0e3742;
  --floor-2:#144b59;
  --paper:#f7edd8;
  --ink:#16272d;
  --muted:#9fc0c7;
  --accent:#ff6a3d;
  --good:#3fbf7a;
  --bad:#e5484d;
  --display:"Shrikhand","Cooper Black",Georgia,serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --cw:clamp(96px,11.5vw,132px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    repeating-radial-gradient(circle at 110% -10%,transparent 0 22px,rgba(255,255,255,.025) 22px 24px),
    radial-gradient(circle at 0% 100%,var(--floor-2),var(--floor) 60%);
  background-color:var(--floor);
  color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
[hidden]{display:none!important}
.logo{font-family:var(--display);color:var(--accent);line-height:.9;letter-spacing:.01em;text-shadow:3px 3px 0 var(--ink)}

/* ---------- Start ---------- */
#setup{height:100%;overflow-y:auto;padding:28px clamp(16px,4vw,48px) 40px}
.setup-in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.hero .logo{font-size:clamp(52px,9vw,96px)}
.hero p{margin:0;max-width:34ch;color:var(--muted);font-size:18px}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:800}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.theme-btn{
  text-align:left;padding:14px 16px 14px 20px;border-radius:6px;background:var(--paper);color:var(--ink);
  border-left:10px solid var(--c);display:flex;flex-direction:column;gap:2px;min-height:86px;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s;
}
.theme-btn b{font-size:19px;font-weight:800;line-height:1.15}
.theme-btn span{font-size:14px;opacity:.7}
.theme-btn[aria-pressed="true"]{background:var(--c);transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 0 rgba(0,0,0,.35)}
.row{display:flex;gap:28px;flex-wrap:wrap}
.row>div{flex:1 1 280px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:52px;padding:10px 16px;border-radius:999px;border:2px solid var(--muted);font-weight:800}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.names input{font:inherit;font-weight:600;padding:10px 12px;border-radius:6px;border:2px solid var(--muted);background:transparent;color:var(--paper);width:100%}
.go{align-self:flex-start;background:var(--accent);color:var(--ink);font-weight:800;font-size:22px;padding:16px 34px;border-radius:999px;box-shadow:0 5px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.note{color:var(--muted);font-size:14px;margin:0;max-width:65ch}
.sp{border:2px solid rgba(159,192,199,.4);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sp input{font:inherit;padding:10px 12px;border-radius:6px;border:2px solid var(--muted);background:transparent;color:var(--paper);width:100%;max-width:420px}
.sp code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.sp .ok{color:var(--good);font-weight:800}
.sp .err{color:#ff8a8d;font-weight:600}
a.mini{color:inherit;text-decoration:none;display:inline-block}
.mini{padding:9px 16px;border-radius:999px;border:2px solid var(--paper);font-weight:800;font-size:15px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.log{max-height:7.5em;overflow-y:auto;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);background:rgba(0,0,0,.28);padding:8px 10px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;max-width:520px}

/* ---------- Spel ---------- */
#game{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;padding:14px clamp(16px,2.5vw,28px) 16px}
.bar{display:flex;align-items:center;gap:14px}
.bar .logo{font-size:30px}
.bar .th{color:var(--muted);font-size:15px;flex:1}
.quit{padding:8px 14px;border-radius:999px;border:2px solid var(--muted);font-size:14px;font-weight:600}
.scores{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;border:2px solid rgba(159,192,199,.4);font-weight:600;color:var(--muted)}
.pill b{font-variant-numeric:tabular-nums;font-weight:800}
.pill.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.pill.on::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}

.stage{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,48px);min-height:0;flex-wrap:wrap}
.vinyl{
  width:clamp(120px,22vh,210px);aspect-ratio:1;border-radius:50%;flex:none;
  background:
    radial-gradient(circle,var(--ink) 0 4%,var(--lab,var(--accent)) 4.5% 33%,transparent 34%),
    repeating-radial-gradient(circle,#0a0f11 0 2px,#1b2327 2px 4px);
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);
  animation:spin 6s linear infinite;
}
.vinyl span{font-family:var(--display);font-size:clamp(26px,5vh,44px);color:var(--ink);animation:spin 6s linear infinite reverse}
.vinyl.stop,.vinyl.stop span{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.info{max-width:520px;display:flex;flex-direction:column;gap:6px}
.who{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
.title{font-family:var(--display);font-size:clamp(28px,4.6vw,46px);line-height:1.02;text-wrap:balance;margin:0}
.artist{font-size:clamp(18px,2.4vw,24px);font-weight:600;margin:0}
.listen{font-size:14px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.listen a{color:var(--paper);font-weight:600}
.act{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;min-height:56px}
.msg{font-weight:600;color:var(--muted)}
.msg.good,.msg.bad{font-size:20px;font-weight:800;padding:10px 18px;border-radius:999px;color:var(--ink)}
.msg.good{background:var(--good)}.msg.bad{background:var(--bad);color:#fff}
.btn{background:var(--accent);color:var(--ink);font-weight:800;font-size:19px;padding:13px 26px;border-radius:999px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--paper);border:2px solid var(--paper);box-shadow:none}

.tlw{min-width:0}
.tlh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px}
.tl{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:10px 4px 14px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.tl::before,.tl::after{content:"";margin:auto}
.card{
  flex:none;width:var(--cw);min-height:calc(var(--cw)*1.36);background:var(--paper);color:var(--ink);border-radius:5px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.card .yr{background:var(--c);font-family:var(--display);font-size:calc(var(--cw)*.3);line-height:1;padding:10px 6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.card .tx{padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.card .tx b{font-weight:800}
.card{position:relative}
.card.good{outline:5px solid var(--good);box-shadow:0 0 22px var(--good);animation:pop .45s}
.card.bad{outline:5px solid var(--bad);box-shadow:0 0 22px var(--bad);animation:shake .45s}
.card.good .yr{background:var(--good)}
.card.bad .yr{background:var(--bad);color:#fff}
.card.good::after,.card.bad::after{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.card.good::after{content:"✓";background:var(--good)}
.card.bad::after{content:"✗";background:var(--bad)}
@keyframes pop{0%{transform:scale(.7) rotate(-6deg)}70%{transform:scale(1.08)}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.slot{
  flex:none;width:44px;border-radius:5px;border:2px dashed rgba(159,192,199,.6);color:var(--muted);
  font-size:26px;font-weight:800;display:grid;place-items:center;transition:width .15s,background .15s;
}
.slot.sel{width:var(--cw);background:var(--accent);border:2px solid var(--accent);color:var(--ink);font-family:var(--display);font-size:calc(var(--cw)*.3)}
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.win .logo{font-size:clamp(44px,8vw,84px)}
.win p{margin:0;font-size:20px;color:var(--muted)}
@media (max-width:520px){.bar .th{display:none}.tlh span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main id="setup">
  <div class="setup-in">
    <div class="hero">
      <div class="logo">Platen&shy;kast</div>
      <p>Je krijgt een hit te zien. Leg hem op de goede plek in je tijdlijn. Wie het eerst zijn rij vol heeft, wint.</p>
    </div>
    <section>
      <h2>Kies een thema</h2>
      <div class="themes" id="themes"></div>
    </section>
    <div class="row">
      <section>
        <h2>Spelers of teams</h2>
        <div class="chips" id="pcount"></div>
        <div class="names" id="names"></div>
      </section>
      <section>
        <h2>Winnen bij</h2>
        <div class="chips" id="target"></div>
      </section>
    </div>
    <section>
      <h2>Muziek via Spotify</h2>
      <div class="sp" id="spbox"></div>
    </section>
    <button class="go" id="go">Start het spel</button>
    <p class="note">Zonder Spotify-verbinding speel je met zichtbare titels. Jaartallen zijn het jaar van eerste uitgave.</p>
  </div>
</main>

<main id="game" hidden></main>

 {id:"mix",n:"Alles door elkaar",s:"Van Bill Haley tot Espresso",c:"#ff6a3d",f:s=>true},
 {id:"nl",n:"Nederlandstalig",s:"Van Johnny Jordaan tot Joost Klein",c:"#f07d2e",f:s=>s.g.includes("n")},

 {id:"80",n:"Jaren 80",s:"Synths en schoudervullingen",c:"#e8478b",f:s=>s.y>=1980&&s.y<1990},

 {id:"dans",n:"Dansvloer",s:"Disco, dance en feestplaten",c:"#9bd13c",f:s=>s.g.includes("d")}

let cfg={theme:"mix",n:2,target:8,names:["","","",""]};

/* ---------- Start ---------- */
function drawSetup(){
  $("themes").innerHTML=THEMES.map(t=>`<button class="theme-btn" style="--c:${t.c}" data-theme="${t.id}" aria-pressed="${cfg.theme===t.id}"><b>${t.n}</b><span>${t.s} · ${S.filter(t.f).length} platen</span></button>`).join("");
  $("pcount").innerHTML=[1,2,3,4].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${cfg.n===n}">${n}</button>`).join("");
  $("target").innerHTML=[5,8,10].map(n=>`<button class="chip" data-t="${n}" aria-pressed="${cfg.target===n}">${n} platen</button>`).join("");
  $("names").innerHTML=Array.from({length:cfg.n},(_,i)=>`<input id="p${i}" aria-label="Naam speler ${i+1}" placeholder="Speler ${i+1}" maxlength="14" value="${esc(cfg.names[i]||"")}">`).join("");
  drawSp();
}
function drawSp(){
  let h="";
  if(location.protocol!=="https:")h=`<span class="err">Spotify werkt alleen als deze pagina op een https-adres staat.</span>`;
  else if(spOn())h=`<span class="ok">Verbonden met Spotify${sp.who?" als "+esc(sp.who):""}</span><span class="note">Open de Spotify-app op deze iPad en speel daar even iets af, zodat de iPad als speler klaarstaat. Sluit de Spotify-app niet af. Titels blijven verborgen tot de plaat ligt.</span>
    <div><h2>Lengte fragment</h2><p class="note" style="margin:0 0 8px">Het fragment herhaalt zich tot de plaat ligt; daarna speelt het nummer door. Zo blijft Spotify op de iPad wakker.</p><div class="chips">`+[[20,"20 sec"],[30,"30 sec"],[45,"45 sec"],[0,"Heel nummer"]].map(x=>`<button class="chip" data-len="${x[0]}" aria-pressed="${(sp.len??30)===x[0]}">${x[1]}</button>`).join("")+`</div></div>
    <div><button class="mini" data-sp="off">Verbinding verbreken</button></div>`;
  else h=`<label for="cid" class="note">Client ID van je eigen Spotify-app</label><input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="32 tekens" value="${esc(sp.cid||"")}">
    <span class="note">Redirect-URI om in je Spotify-app in te vullen: <code>${esc(REDIR)}</code></span>
    <div><button class="mini" data-sp="on">Verbind met Spotify</button></div>`;
  if(spErr)h+=`<span class="err">${esc(spErr)}</span>`;
  $("spbox").innerHTML=h;
}
function keepNames(){for(let i=0;i<4;i++){const e=$("p"+i);if(e)cfg.names[i]=e.value.trim()}}
$("setup").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  keepNames();
  if(b.dataset.theme)cfg.theme=b.dataset.theme;
  else if(b.dataset.n)cfg.n=+b.dataset.n;
  else if(b.dataset.t)cfg.target=+b.dataset.t;
  else if(b.dataset.len!==undefined){sp.len=+b.dataset.len;spSave()}
  else if(b.dataset.sp==="off"){sp={cid:sp.cid};spSave();spErr=""}
  else if(b.dataset.sp==="on"){
    const c=($("cid").value||"").trim();
    if(!/^[0-9a-f]{32}$/i.test(c)){spErr="Vul de Client ID in: 32 letters en cijfers uit het Spotify-dashboard."}
    else{spErr="";spLogin(c);return}
  }
  else if(b.id==="go"){newGame();return}
  drawSetup();
});
function showSetup(){spPause();st=null;$("game").hidden=true;$("setup").hidden=false;drawSetup()}

/* ---------- Spel ---------- */
function newGame(){
  try{localStorage.setItem("platenkast-cfg",JSON.stringify(cfg))}catch(e){}
  const th=THEMES.find(t=>t.id===cfg.theme);
  const deck=shuffle(S.map((s,i)=>i).filter(i=>th.f(S[i])));
  st={theme:th.id,target:cfg.target,turn:0,turns:0,deck,discard:[],sel:null,phase:"place",res:null,
      players:Array.from({length:cfg.n},(_,i)=>({name:cfg.names[i]||"Speler "+(i+1),cards:[deck.pop()]}))};
  draw();show();spPlay();
}
function draw(){
  if(!st.deck.length){st.deck=shuffle(st.discard);st.discard=[]}
  if(!st.deck.length){st.phase="win";st.cur=null;return}
  st.cur=st.deck.pop();st.sel=null;st.res=null;st.phase="place";st.reveal=false;if(spOn())spMsg="";
}
function show(){$("setup").hidden=true;$("game").hidden=false;render()}
function confirmPlace(){
  const p=st.players[st.turn],y=S[st.cur].y,i=st.sel;
  const lo=i>0?S[p.cards[i-1]].y:-1e9, hi=i<p.cards.length?S[p.cards[i]].y:1e9;
  const ok=lo<=y&&y<=hi;
  if(ok)p.cards.splice(i,0,st.cur);
  st.res={ok,pos:i};st.phase="result";st.turns++;render();
}
function next(){
  const p=st.players[st.turn];
  if(st.res.ok&&p.cards.length>=st.target){st.phase="win";spPause();render();return}
  if(!st.res.ok)st.discard.push(st.cur);
  st.turn=(st.turn+1)%st.players.length;
  draw();render();
  if(st.phase==="place")spPlay();else spPause();
}
const cardHTML=(i,cls)=>{const s=S[i];return `<div class="card ${cls||""}" style="--c:${col(s.y)}"><div class="yr">${s.y}</div><div class="tx"><b>${esc(s.a)}</b><span>${esc(s.t)}</span></div></div>`};

function render(){
  const g=$("game"),th=THEMES.find(t=>t.id===st.theme),p=st.players[st.turn];
  const solo=st.players.length===1;
  let h=`<header class="bar"><div class="logo">Platenkast</div><div class="th">${th.n} · eerste met ${st.target} platen wint</div><button class="quit" data-act="quit">${quitArmed?"Zeker weten?":"Stoppen"}</button></header>`;
  h+=`<div class="scores">`+st.players.map((q,i)=>`<div class="pill ${i===st.turn&&st.phase!=="win"?"on":""}">${esc(q.name)} <b>${q.cards.length}/${st.target}</b></div>`).join("")+`</div>`;

  if(st.phase==="win"){
    const best=Math.max(...st.players.map(q=>q.cards.length));
    const w=st.players.filter(q=>q.cards.length===best).map(q=>q.name);
    const full=best>=st.target;
    h+=`<section class="stage"><div class="win"><div class="logo">${solo?(full?"Rij vol!":"Platen op"):esc(w.join(" & "))+(w.length>1?" winnen!":" wint!")}</div>
      <p>${solo?`${best} platen in ${st.turns} beurten.`:(full?`${best} platen op een rij, in de goede volgorde.`:`De stapel is op. Hoogste stand: ${best} platen.`)}</p>
      <div class="act"><button class="btn" data-act="again">Nog een keer</button><button class="btn ghost" data-act="menu">Ander thema</button></div></div></section>`;
    const wp=st.players.find(q=>q.cards.length===best);
    h+=tl(wp,st.res&&st.res.ok&&wp===st.players[st.turn]?st.res:null);
    g.innerHTML=h;return;
  }
  const s=S[st.cur],res=st.res,q=encodeURIComponent(s.a+" "+s.t);
  h+=`<section class="stage"><div class="vinyl ${res?"stop":""}" style="${res?"--lab:var(--"+(res.ok?"good":"bad")+")":""}"><span>${res?s.y:"?"}</span></div>
    <div class="info"><div class="who">${solo?"Jouw beurt":"Beurt voor "+esc(p.name)}</div>
    `;
  if(spOn()&&!res&&!st.reveal){
    h+=`<h1 class="title">Welke plaat hoor je?</h1><p class="artist">${esc(spMsg||(spDev?"Speelt af op "+spDev+". ":"")+"Luister en leg hem op zijn plek.")}</p>
    <div class="ctl"><button class="mini" data-act="play">Speel opnieuw</button><button class="mini" data-act="reveal">Toon titel</button>${spMsg?`<a class="mini" href="spotify:">Open Spotify</a>`:""}</div>`;
    if(spMsg&&LOG.length)h+=`<pre class="log">${esc(LOG.join("\n"))}</pre>`;
  }else{
    h+=`<h1 class="title">${esc(s.t)}</h1><p class="artist">${esc(s.a)}</p>`;
    h+=spOn()?(res?"":`<div class="ctl"><button class="mini" data-act="play">Speel opnieuw</button></div>`)
      :`<div class="listen">Luister: <a href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">Spotify</a><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube</a></div>`
       +(!res&&spMsg?`<p class="artist" style="color:#ff8a8d;font-size:17px">${esc(spMsg)}</p>`+(LOG.length?`<pre class="log">${esc(LOG.join("\n"))}</pre>`:""):"");
  }
  h+=`<div class="act">`;
  if(!res){
    h+=st.sel===null?`<span class="msg">Tik in de tijdlijn op de plek waar deze plaat hoort.</span>`
      :`<button class="btn" data-act="ok">Leg hier neer</button><span class="msg">Of tik een andere plek aan.</span>`;
  }else{
    h+=`<span class="msg ${res.ok?"good":"bad"}">${res.ok?"✓ Goed! De plaat blijft liggen.":"✗ Fout! Het was "+s.y+", de plaat gaat terug."}</span><button class="btn" data-act="next">${res.ok&&p.cards.length>=st.target?"Bekijk de uitslag":"Volgende plaat"}</button>`;
  }
  h+=`</div></div></section>`+tl(p,res);
  g.innerHTML=h;
  const L=g.querySelector(".log");if(L)L.scrollTop=L.scrollHeight;
  const f=g.querySelector(".slot.sel,.card.good,.card.bad");
  if(f)f.scrollIntoView({inline:"center",block:"nearest"});
}
function tl(p,res){
  let c=p.cards.map(i=>({i,cls:""}));
  if(res){ if(res.ok)c[res.pos].cls="good"; else c.splice(res.pos,0,{i:st.cur,cls:"bad"}) }
  const placing=st.phase==="place";
  let h=`<section class="tlw"><div class="tlh"><div>Tijdlijn van ${esc(p.name)}</div><span>ouder ← → nieuwer</span></div><div class="tl">`;
  const slot=i=>placing?`<button class="slot ${st.sel===i?"sel":""}" data-slot="${i}" aria-label="Plek ${i+1} van ${c.length+1}">${st.sel===i?"?":"+"}</button>`:"";
  c.forEach((x,i)=>{h+=slot(i)+cardHTML(x.i,x.cls)});
  return h+slot(c.length)+`</div></section>`;
}
$("game").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.slot!==undefined){st.sel=+b.dataset.slot;quitArmed=false;render();return}
  const a=b.dataset.act;
  if(a==="quit"){ if(quitArmed){quitArmed=false;showSetup()} else{quitArmed=true;render();setTimeout(()=>{if(quitArmed&&st){quitArmed=false;render()}},3000)} return}
  quitArmed=false;
  if(a==="play")spPlay();
  else if(a==="pause")spPause();
  else if(a==="reveal"){st.reveal=true;render()}
  else if(a==="ok")confirmPlace();
  else if(a==="next")next();
  else if(a==="again")newGame();
  else if(a==="menu")showSetup();
});

/* ---------- Spotify: stuurt de Spotify-app op dit apparaat aan ---------- */
function spSave(){try{localStorage.setItem("platenkast-sp",JSON.stringify(sp))}catch(e){}}
function spSync(){try{const x=JSON.parse(localStorage.getItem("platenkast-sp")||"null");if(x&&x.cid)sp=x}catch(e){}}
function spOn(){return !!sp.refresh}
const LOG=[];
function logc(s){LOG.push(new Date().toLocaleTimeString("nl-NL")+"  "+s);if(LOG.length>6)LOG.shift()}
let refreshing=null;
function spRefresh(){
  if(!refreshing)refreshing=spToken({grant_type:"refresh_token",refresh_token:sp.refresh}).finally(()=>{refreshing=null});
  return refreshing;
}
function rnd(n){const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";return Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>c[x%62]).join("")}
async function spLogin(cid){
  const v=rnd(64),d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
  const ch=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  sp={cid,verifier:v,len:sp.len??30,uris:sp.uris};spSave();
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:REDIR,
    scope:"user-modify-playback-state user-read-playback-state",code_challenge_method:"S256",code_challenge:ch});
}
async function spToken(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:sp.cid,...body})});
  logc("inlog ("+body.grant_type+") → "+r.status);
  if(!r.ok){let d="";try{const x=await r.json();d=x.error_description||x.error||""}catch(e){}logc("  "+d);throw new Error("token "+r.status+(d?" ("+d+")":""))}
  const j=await r.json();
  sp.access=j.access_token;sp.exp=Date.now()+(j.expires_in-60)*1000;if(j.refresh_token)sp.refresh=j.refresh_token;spSave();
}
async function spFinish(){
  const q=new URLSearchParams(location.search),code=q.get("code"),err=q.get("error");
  if(!code&&!err)return;
  history.replaceState(null,"",location.pathname);
  if(err){spErr="Spotify gaf geen toestemming ("+err+").";return}
  try{await spToken({grant_type:"authorization_code",code,redirect_uri:REDIR,code_verifier:sp.verifier});delete sp.verifier;spSave()}
  catch(e){spErr="Verbinden mislukt. Controleer of de Client ID en de redirect-URI exact kloppen en probeer opnieuw.";return}
  try{const me=await api("GET","/me");if(me.ok&&me.j){sp.who=me.j.display_name||me.j.id||"";spSave();logc("account: "+sp.who)}}catch(e){}
}
async function api(method,path,body,again){
  if(!refreshing)spSync();
  if(!sp.refresh)throw new Error("token none");
  if(Date.now()>(sp.exp||0))await spRefresh();
  const r=await fetch("https://api.spotify.com/v1"+path,{method,headers:{Authorization:"Bearer "+sp.access,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  let j=null,t="";try{t=await r.text();j=t?JSON.parse(t):null}catch(e){}
  const why=((j&&j.error&&(j.error.message||j.error.reason))||(j?"":t)||"").toString().trim().slice(0,200);
  logc(method+" "+path.split("?")[0].replace("/me/player","player")+" → "+r.status+(why?" "+why.slice(0,80):""));
  if(r.status===401&&!again){await spRefresh();return api(method,path,body,true)}
  return{ok:r.ok,status:r.status,j,why};
}
const norm=x=>x.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");
async function spUri(i){
  const s=S[i],k=s.a+"|"+s.t;sp.uris=sp.uris||{};
  if(sp.uris[k])return sp.uris[k];
  const clean=x=>x.replace(/\(.*?\)/g," ").replace(/[^\p{L}\p{N}'.& ]/gu," ").replace(/\s+/g," ").trim();
  const r=await api("GET","/search?type=track&limit=5&q="+encodeURIComponent(clean(s.t)+" "+clean(s.a)));
  if(!r.ok)throw new Error("search "+r.status+(r.why?": "+r.why:""));
  sp.uris=sp.uris||{};
  const items=(r.j&&r.j.tracks&&r.j.tracks.items)||[];
  if(!items.length)return null;
  const want=norm(s.a);
  const hit=items.find(it=>it.artists.some(a=>{const n=norm(a.name);return n&&(want.includes(n)||n.includes(want))}))||items[0];
  sp.uris[k]=hit.uri;spSave();return hit.uri;
}
function say(m){spMsg=m;if(st&&st.phase==="place")render()}
async function spPlay(){
  if(!spOn()||!st||st.cur==null)return;
  const cur=st.cur;clearInterval(pauseT);
  try{
    const uri=await spUri(cur);
    if(!st||st.cur!==cur)return;
    if(!uri)return say("Niet gevonden op Spotify. Tik op Toon titel.");
    const body={uris:[uri],position_ms:0};
    if(!sp.who){const me=await api("GET","/me");if(me.ok&&me.j){sp.who=me.j.display_name||me.j.id||"";spSave()}}
    const d=await api("GET","/me/player/devices"),list=((d.j&&d.j.devices)||[]).filter(x=>!x.is_restricted);
    if(!st||st.cur!==cur)return;
    if(d.status===401){sp={cid:sp.cid};spSave();return say("Spotify-verbinding verlopen. Verbind opnieuw via Stoppen.")}
    logc("spelers"+(sp.who?" van "+sp.who:"")+": "+(list.map(x=>x.name+(x.is_active?" (actief)":"")).join(", ")||"geen"));
    const isPad=x=>x.type==="Tablet"||/ipad/i.test(x.name);
    let dev=list.find(isPad);
    if(dev){sp.pad={id:dev.id,name:dev.name,type:dev.type};spSave()}
    else if(sp.pad)dev=sp.pad;
    else dev=list.find(x=>x.is_active)||list[0];
    if(!dev)return say("Geen speler gevonden. Open de Spotify-app op deze iPad, laat een nummer doorspelen en tik op Speel opnieuw.");
    let r=await api("PUT","/me/player/play?device_id="+encodeURIComponent(dev.id),body);
    if(!st||st.cur!==cur)return;
    if(r.status===401){sp={cid:sp.cid};spSave();return say("Spotify-verbinding verlopen. Verbind opnieuw via Stoppen.")}
    if(r.status===404&&!list.some(x=>x.id===dev.id))return say("De iPad is bij Spotify in slaap gevallen. Open de Spotify-app, tik op afspelen, ga terug en tik op Speel opnieuw.");
    if(!r.ok)return say("Spotify speelt niet af (code "+r.status+(r.why?": "+r.why:"")+"). Open de Spotify-app en tik op Speel opnieuw.");
    spDev=dev.name||"";
    api("PUT","/me/player/repeat?state=track&device_id="+encodeURIComponent(dev.id)).catch(()=>{});
    const len=sp.len??30;
    if(len>0)pauseT=setInterval(()=>{
      if(st&&st.cur===cur&&st.phase==="place")api("PUT","/me/player/seek?position_ms=0&device_id="+encodeURIComponent(dev.id)).catch(()=>{});
      else clearInterval(pauseT);
    },len*1000);
    say(dev.type!=="Tablet"&&!/ipad/i.test(dev.name)?"Speelt af op "+spDev+", niet op de iPad. Sluit Spotify op dat apparaat, open de Spotify-app op de iPad en tik op Speel opnieuw.":"");
  }catch(e){say(spErrMsg(e))}
}
function spErrMsg(e){
  const m=String((e&&e.message)||e);
  if(m==="token none")return "Niet meer verbonden met Spotify. Tik op Stoppen en verbind opnieuw.";
  if(/^(token 400|search 401)/.test(m)){sp={cid:sp.cid};spSave();return "Spotify-inlog is verlopen ("+m+"). Tik op Stoppen en verbind opnieuw."}
  if(/^search 403/.test(m))return "Spotify weigert het zoeken ("+m+"). Log in met het account dat de app in het dashboard heeft gemaakt, en dat moet Premium hebben.";
  if(/^search 429/.test(m))return "Spotify krijgt te veel verzoeken ("+m+"). Wacht een minuut en tik op Speel opnieuw.";
  if(/^(token|search) /.test(m))return "Spotify geeft een fout: "+m+". Tik op Speel opnieuw.";
  return "Geen contact met Spotify ("+m+"). Controleer de internetverbinding en tik op Speel opnieuw.";
}
function spPause(){clearInterval(pauseT);if(spOn())api("PUT","/me/player/pause").catch(()=>{})}

/* ---------- Opstarten ---------- */
spFinish().then(showSetup);
</script>
